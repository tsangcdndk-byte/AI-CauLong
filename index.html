<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Cầm Cầu Lông - GV Thể Dục</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; overflow-x: hidden; }
        .app-card { width: 100%; max-width: 420px; margin: auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; font-size: 1.1rem; margin: 10px 0; text-transform: uppercase; }
        
        #webcam-wrapper { 
            width: 100%; aspect-ratio: 1/1; border: 7px solid #333; border-radius: 20px; 
            background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        #webcam-wrapper canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
        #loading-ui { position: absolute; color: white; font-size: 14px; background: rgba(0,0,0,0.7); width: 100%; height: 100%; padding-top: 45%; z-index: 10; display: none; }

        .btn { padding: 18px; font-size: 16px; border-radius: 12px; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%; margin: 6px 0; text-transform: uppercase; transition: 0.2s; }
        #start-btn { background: #28a745; box-shadow: 0 4px 12px rgba(40,167,69,0.3); }
        #switch-btn { background: #007bff; display: none; }
        .btn:disabled { opacity: 0.6; }

        .result-item { margin-top: 10px; padding: 12px; border-radius: 15px; background: #f8f9fa; text-align: left; border: 1px solid transparent; }
        .bar-bg { width: 100%; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; margin-top: 6px; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.2s ease-out; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Mặc định: <b>Camera Sau</b></p>
    
    <button id="start-btn" class="btn" onclick="startApp()">▶ BẮT ĐẦU PHÂN TÍCH</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA TRƯỚC/SAU</button>
    
    <div id="webcam-wrapper">
        <div id="loading-ui">ĐANG XỬ LÝ...</div>
        <div id="msg" style="color: #888; font-size: 13px;">Hãy mở bằng Safari/Chrome</div>
    </div>
    
    <div id="dashboard" style="display:none; margin-top: 15px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = true; 
    let isProcessing = false;
    let cameraCount = 0;

    // Đếm số lượng camera khả dụng
    async function checkCameraCount() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameraCount = devices.filter(d => d.kind === 'videoinput').length;
    }

    async function startApp() {
        if(isProcessing) return;
        isProcessing = true;
        document.getElementById("start-btn").innerText = "ĐANG TẢI AI...";

        try {
            await checkCameraCount();
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            
            await setupWebcam();
            createDashboard();

            document.getElementById("start-btn").style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            window.requestAnimationFrame(loop);
        } catch (e) {
            alert("LỖI QUYỀN: Bạn cần chọn 'Cho phép Camera' trong cài đặt trình duyệt để tiếp tục.");
            document.getElementById("start-btn").innerText = "▶ THỬ LẠI";
        }
        isProcessing = false;
    }

    async function setupWebcam() {
        document.getElementById("loading-ui").style.display = "block";
        if (webcam) { await webcam.stop(); }
        
        // Nghỉ một nhịp để phần cứng kịp phản hồi
        await new Promise(r => setTimeout(r, 600));

        const flip = !isFacingBack; 
        webcam = new tmImage.Webcam(320, 320, flip);
        
        try {
            await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
            await webcam.play();
            const wrapper = document.getElementById("webcam-wrapper");
            wrapper.innerHTML = '<div id="loading-ui">ĐANG XỬ LÝ...</div>';
            wrapper.appendChild(webcam.canvas);
        } catch (err) {
            throw err; // Bắn lỗi lên để hàm switchCamera xử lý
        } finally {
            document.getElementById("loading-ui").style.display = "none";
        }
    }

    async function switchCamera() {
        if (isProcessing) return;
        
        // 1. Kiểm tra nếu chỉ có 1 camera
        if (cameraCount < 2) {
            alert("Thiết bị của bạn chỉ có 1 Camera, không thể chuyển đổi!");
            return;
        }

        isProcessing = true;
        const btn = document.getElementById("switch-btn");
        btn.disabled = true;

        // Lưu trạng thái cũ để nếu lỗi thì quay lại
        const oldState = isFacingBack;
        isFacingBack = !isFacingBack;

        try {
            await setupWebcam();
        } catch (e) {
            alert("Lỗi phần cứng khi chuyển Camera. Hệ thống sẽ quay lại Camera cũ.");
            isFacingBack = oldState; // Quay lại trạng thái cũ
            await setupWebcam();
        } finally {
            btn.disabled = false;
            isProcessing = false;
        }
    }

    function createDashboard() {
        const db = document.getElementById("dashboard");
        db.innerHTML = "";
        model.getClassLabels().forEach((l, i) => {
            const clean = l.toLowerCase();
            let color = clean.includes("dung") ? "#28a745" : (clean.includes("sai") ? "#dc3545" : "#6c757d");
            db.innerHTML += `
                <div class="result-item" id="row-${i}">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:14px;">
                        <span>${l}</span> <span id="p${i}">0%</span>
                    </div>
                    <div class="bar-bg"><div id="b${i}" class="bar-fill" style="background:${color}"></div></div>
                </div>`;
        });
    }

    async function loop() {
        webcam.update();
        const pred = await model.predict(webcam.canvas);
        pred.forEach((p, i) => {
            const prob = (p.probability * 100).toFixed(0);
            document.getElementById(`p${i}`).innerText = prob + "%";
            document.getElementById(`b${i}`).style.width = prob + "%";
            const row = document.getElementById(`row-${i}`);
            if (prob > 75) {
                row.style.background = "#e8f0fe";
                row.style.borderColor = "#1a73e8";
            } else {
                row.style.background = "#f8f9fa";
                row.style.borderColor = "transparent";
            }
        });
        window.requestAnimationFrame(loop);
    }
</script>
</body>
</html>
