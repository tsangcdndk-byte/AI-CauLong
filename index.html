<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Kiểm Tra Cầm Cầu</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 10px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #webcam-container { margin: 15px auto; border: 4px solid #333; width: 280px; height: 280px; border-radius: 10px; overflow: hidden; background: #000; }
        #webcam-container canvas { width: 100% !important; height: 100% !important; }
        
        .btn { padding: 15px; font-size: 16px; border-radius: 10px; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; }
        #start-btn { background: #28a745; }
        #check-btn { background: #007bff; display: none; }

        /* Bảng hiển thị 3 kết quả song song */
        .status-box { margin-top: 15px; text-align: left; }
        .label-row { margin-bottom: 10px; padding: 10px; border-radius: 8px; background: #eee; }
        .bar-bg { width: 100%; height: 12px; background: #ddd; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.2s; }
        .fill-dung { background: #28a745; }
        .fill-sai { background: #dc3545; }
        .fill-nen { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="color: #1a73e8;">AI NHẬN DIỆN CẦM CẦU</h3>
    
    <button id="start-btn" onclick="init()">1. MỞ CAMERA</button>
    <button id="check-btn" onclick="startCheck()">2. BẮT ĐẦU KIỂM TRA</button>

    <div id="webcam-container"></div>

    <div class="status-box">
        <div class="label-row" id="row-0">
            <strong>ĐÚNG KỸ THUẬT: <span id="val-0">0%</span></strong>
            <div class="bar-bg"><div id="bar-0" class="bar-fill fill-dung"></div></div>
        </div>
        <div class="label-row" id="row-1">
            <strong>SAI KỸ THUẬT: <span id="val-1">0%</span></strong>
            <div class="bar-bg"><div id="bar-1" class="bar-fill fill-sai"></div></div>
        </div>
        <div class="label-row" id="row-2">
            <strong>NỀN: <span id="val-2">0%</span></strong>
            <div class="bar-bg"><div id="bar-2" class="bar-fill fill-nen"></div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let runCheck = false;

    async function init() {
        document.getElementById("start-btn").innerText = "ĐANG TẢI...";
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(280, 280, false);
        await webcam.setup({ facingMode: "user" });
        await webcam.play();
        
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        document.getElementById("start-btn").style.display = "none";
        document.getElementById("check-btn").style.display = "block";
        window.requestAnimationFrame(loop);
    }

    async function loop() {
        webcam.update();
        if (runCheck) await predict();
        window.requestAnimationFrame(loop);
    }

    function startCheck() {
        runCheck = true;
        document.getElementById("check-btn").style.backgroundColor = "#ffc107";
        document.getElementById("check-btn").innerText = "ĐANG KIỂM TRA...";
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const prob = (prediction[i].probability * 100).toFixed(0);
            document.getElementById(`val-${i}`).innerText = prob + "%";
            document.getElementById(`bar-${i}`).style.width = prob + "%";
            
            // Làm nổi bật dòng có % cao nhất
            document.getElementById(`row-${i}`).style.background = prob > 70 ? "#d4edda" : "#eee";
        }
    }
</script>
</body>
</html>
