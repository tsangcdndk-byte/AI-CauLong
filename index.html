<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Cầm Cầu Lông - Bản Sửa Lỗi Quyền</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; overflow-x: hidden; }
        .app-card { width: 100%; max-width: 400px; margin: 5px auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin: 10px 0; text-transform: uppercase; font-size: 1.1rem; }
        
        #webcam-wrapper { 
            width: 100%; aspect-ratio: 1/1; border: 6px solid #333; border-radius: 20px; 
            background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        #webcam-wrapper canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
        #status-log { position: absolute; bottom: 10px; left: 10px; color: #0f0; font-size: 10px; text-align: left; background: rgba(0,0,0,0.5); padding: 5px; pointer-events: none; }

        .btn { padding: 18px; font-size: 16px; border-radius: 12px; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%; margin: 8px 0; text-transform: uppercase; }
        #start-btn { background: #28a745; }
        #switch-btn { background: #007bff; display: none; }

        .result-item { margin-top: 10px; padding: 10px; border-radius: 12px; background: #f8f9fa; text-align: left; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    
    <button id="start-btn" class="btn" onclick="requestPermissionAndStart()">▶ NHẤN ĐỂ KÍCH HOẠT</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA TRƯỚC/SAU</button>
    
    <div id="webcam-wrapper">
        <div id="status-log">Trạng thái: Đang chờ...</div>
        <div id="msg" style="color: #888; font-size: 13px;">Nhấn nút xanh để bắt đầu</div>
    </div>
    
    <div id="dashboard" style="display:none; margin-top: 15px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = true; // Mặc định camera sau
    let isProcessing = false;

    function log(msg) { document.getElementById("status-log").innerText = "Log: " + msg; }

    // BƯỚC QUAN TRỌNG NHẤT: XIN QUYỀN TRỰC TIẾP
    async function requestPermissionAndStart() {
        if(isProcessing) return;
        isProcessing = true;
        log("Đang xin quyền hệ thống...");

        try {
            // Ép hệ điều hành mở camera để kiểm tra quyền thực tế
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: isFacingBack ? "environment" : "user" } });
            stream.getTracks().forEach(track => track.stop()); // Tắt ngay sau khi biết đã có quyền
            
            log("Quyền OK. Đang tải mô hình...");
            await startApp();
        } catch (err) {
            log("Lỗi quyền: " + err.message);
            alert("BẠN CẦN CHO PHÉP: Nhấn vào biểu tượng Ổ KHÓA/AA trên thanh địa chỉ, chọn 'Cho phép Camera' rồi tải lại trang.");
            isProcessing = false;
        }
    }

    async function startApp() {
        try {
            if (!model) {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            }
            maxPredictions = model.getTotalClasses();
            await setupWebcam();
            createDashboard();
            
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            window.requestAnimationFrame(loop);
        } catch (e) {
            log("Lỗi tải Model: " + e.message);
        }
        isProcessing = false;
    }

    async function setupWebcam() {
        log("Khởi tạo phần cứng...");
        if (webcam) { await webcam.stop(); }
        
        // Khoảng nghỉ để giải phóng tài nguyên
        await new Promise(r => setTimeout(r, 600));

        const flip = !isFacingBack; 
        webcam = new tmImage.Webcam(300, 300, flip);
        
        await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
        await webcam.play();

        const wrapper = document.getElementById("webcam-wrapper");
        wrapper.innerHTML = '<div id="status-log"></div>';
        wrapper.appendChild(webcam.canvas);
        log("Camera sẵn sàng!");
    }

    async function switchCamera() {
        if (isProcessing) return;
        isProcessing = true;
        isFacingBack = !isFacingBack;
        log("Đang đổi camera...");
        try {
            await setupWebcam();
        } catch (e) {
            log("Lỗi đổi cam: " + e.message);
            isFacingBack = !isFacingBack;
            await setupWebcam();
        }
        isProcessing = false;
    }

    function createDashboard() {
        const db = document.getElementById("dashboard");
        db.innerHTML = "";
        model.getClassLabels().forEach((l, i) => {
            const clean = l.toLowerCase();
            let color = clean.includes("dung") ? "#28a745" : (clean.includes("sai") ? "#dc3545" : "#6c757d");
            db.innerHTML += `
                <div class="result-item" id="row-${i}">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px;">
                        <span>${l}</span> <span id="p${i}">0%</span>
                    </div>
                    <div class="bar-bg"><div id="b${i}" class="bar-fill" style="background:${color}"></div></div>
                </div>`;
        });
    }

    async function loop() {
        webcam.update();
        const pred = await model.predict(webcam.canvas);
        pred.forEach((p, i) => {
            const prob = (p.probability * 100).toFixed(0);
            document.getElementById(`p${i}`).innerText = prob + "%";
            document.getElementById(`b${i}`).style.width = prob + "%";
            document.getElementById(`row-${i}`).style.background = prob > 70 ? "#e8f0fe" : "#f8f9fa";
        });
        window.requestAnimationFrame(loop);
    }
</script>
</body>
</html>
