<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Kiểm Tra Cầm Cầu</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; overflow: hidden; }
        .app-card { width: 100%; max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        #webcam-wrapper { 
            width: 100%; aspect-ratio: 1/1; border: 6px solid #333; border-radius: 20px; 
            background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        #webcam-wrapper canvas, #webcam-wrapper video { width: 100% !important; height: 100% !important; object-fit: cover; }
        
        #log { position: absolute; top: 0; left: 0; color: #0f0; font-size: 10px; background: rgba(0,0,0,0.6); width: 100%; text-align: left; padding: 5px; pointer-events: none; z-index: 20; }

        .btn { padding: 18px; font-size: 16px; border-radius: 12px; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%; margin: 8px 0; text-transform: uppercase; }
        #start-btn { background: #28a745; }
        #switch-btn { background: #007bff; display: none; }

        .result-item { margin-top: 10px; padding: 10px; border-radius: 12px; background: #f8f9fa; text-align: left; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

<div class="app-card">
    <h2 style="color:#1a73e8; font-size:18px; margin:10px 0;">AI CẦM CẦU LÔNG</h2>
    
    <button id="start-btn" class="btn" onclick="startApp()">▶ MỞ CAMERA SAU</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA</button>
    
    <div id="webcam-wrapper">
        <div id="log">Trạng thái: Sẵn sàng</div>
        <div id="msg" style="color: #888; font-size: 13px;">Đang chờ nhấn nút...</div>
    </div>
    
    <div id="dashboard" style="display:none; margin-top: 15px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = true; // Ưu tiên Camera Sau
    let isBusy = false;

    function updateLog(msg) { document.getElementById("log").innerText = "Hệ thống: " + msg; }

    async function startApp() {
        if(isBusy) return;
        isBusy = true;
        updateLog("Đang tải mô hình AI...");
        
        try {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            
            await initCamera();
            
            createDashboard();
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            window.requestAnimationFrame(loop);
        } catch (e) {
            updateLog("Lỗi: " + e.message);
            alert("KHÔNG THỂ MỞ: Hãy dùng Safari/Chrome, nhấn 'Cho phép' và đảm bảo không có app nào khác đang dùng Cam.");
        }
        isBusy = false;
    }

    async function initCamera() {
        updateLog("Đang kết nối Camera " + (isFacingBack ? "Sau" : "Trước") + "...");
        
        if (webcam) { await webcam.stop(); }

        // Khoảng nghỉ quan trọng để iPhone giải phóng phần cứng
        await new Promise(r => setTimeout(r, 800));

        // Tự cấu hình Camera thay vì dùng mặc định của thư viện
        const constraints = {
            video: {
                facingMode: isFacingBack ? "environment" : "user",
                width: { ideal: 640 },
                height: { ideal: 640 }
            }
        };

        try {
            // Bước "Đánh thức" Camera chuẩn web
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            
            // Sau khi có stream, đưa vào webcam của Teachable Machine
            webcam = new tmImage.Webcam(300, 300, !isFacingBack);
            await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
            await webcam.play();

            const wrapper = document.getElementById("webcam-wrapper");
            wrapper.innerHTML = '<div id="log"></div>';
            wrapper.appendChild(webcam.canvas);
            updateLog("Camera Hoạt Động!");
        } catch (err) {
            updateLog("Thử lại với cấu hình thấp...");
            // Nếu lỗi, thử mở camera mà không kèm thông số độ phân giải
            webcam = new tmImage.Webcam(300, 300, !isFacingBack);
            await webcam.setup(); // Để máy tự chọn
            await webcam.play();
        }
    }

    async function switchCamera() {
        if(isBusy) return;
        isBusy = true;
        isFacingBack = !isFacingBack;
        updateLog("Đang chuyển đổi...");
        try {
            await initCamera();
        } catch (e) {
            updateLog("Lỗi chuyển: " + e.message);
            isFacingBack = !isFacingBack;
        }
        isBusy = false;
    }

    function createDashboard() {
        const db = document.getElementById("dashboard");
        db.innerHTML = "";
        model.getClassLabels().forEach((l, i) => {
            const clean = l.toLowerCase();
            let color = clean.includes("dung") ? "#28a745" : (clean.includes("sai") ? "#dc3545" : "#6c757d");
            db.innerHTML += `
                <div class="result-item" id="row-${i}">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px;">
                        <span>${l}</span> <span id="p${i}">0%</span>
                    </div>
                    <div class="bar-bg"><div id="b${i}" class="bar-fill" style="background:${color}"></div></div>
                </div>`;
        });
    }

    async function loop() {
        webcam.update();
        const pred = await model.predict(webcam.canvas);
        pred.forEach((p, i) => {
            const prob = (p.probability * 100).toFixed(0);
            document.getElementById(`p${i}`).innerText = prob + "%";
            document.getElementById(`b${i}`).style.width = prob + "%";
            document.getElementById(`row-${i}`).style.background = prob > 75 ? "#e8f0fe" : "#f8f9fa";
        });
        window.requestAnimationFrame(loop);
    }
</script>
</body>
</html>
