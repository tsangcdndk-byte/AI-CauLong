<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Kiểm Tra Cầm Cầu - GV Thể Dục</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .app-card { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-bottom: 5px; text-transform: uppercase; font-size: 22px; }
        p.sub-title { color: #777; font-size: 14px; margin-bottom: 20px; }
        
        #webcam-container { 
            margin: 15px auto; 
            border: 6px solid #333; 
            width: 280px; 
            height: 280px; 
            border-radius: 20px; 
            overflow: hidden; 
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #webcam-container canvas { width: 100% !important; height: 100% !important; object-fit: cover; }

        .btn { 
            padding: 18px; 
            font-size: 18px; 
            border-radius: 15px; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin: 10px 0;
            transition: all 0.2s;
        }
        #start-btn { background: #28a745; box-shadow: 0 4px 15px rgba(40,167,69,0.3); }
        #switch-btn { background: #007bff; display: none; }
        
        #result-box { 
            font-size: 30px; 
            font-weight: 900; 
            margin-top: 15px; 
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            text-transform: uppercase;
        }
        .status-text { font-size: 13px; color: #999; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    <p class="sub-title">Dành cho học sinh tập luyện kỹ thuật</p>

    <button id="start-btn" class="btn" onclick="startCamera()">▶ BẮT ĐẦU KIỂM TRA</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA SAU/TRƯỚC</button>

    <div id="webcam-container">
        <div id="placeholder" style="color: white; font-size: 14px;">Đang chờ Camera...</div>
    </div>

    <div id="result-box">---</div>
    <p class="status-text">Mô hình gồm 3 lớp: Đúng, Sai, Nền</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, labelContainer, maxPredictions;
    let isFacingBack = false;

    async function startCamera() {
        document.getElementById("start-btn").innerText = "ĐANG TẢI AI...";
        try {
            if (!model) {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            }
            maxPredictions = model.getTotalClasses();
            await initWebcam();
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
        } catch (err) {
            alert("LỖI: Không mở được camera. Vui lòng kiểm tra quyền truy cập.");
            document.getElementById("start-btn").innerText = "THỬ LẠI";
        }
    }

    async function initWebcam() {
        const flip = !isFacingBack;
        webcam = new tmImage.Webcam(280, 280, flip);
        const facingMode = isFacingBack ? "environment" : "user";
        await webcam.setup({ facingMode }); 
        await webcam.play();
        window.requestAnimationFrame(loop);
        const container = document.getElementById("webcam-container");
        container.innerHTML = ""; 
        container.appendChild(webcam.canvas);
        labelContainer = document.getElementById("result-box");
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    // Hàm khử dấu tiếng Việt tối ưu cho cả 3 nhãn của bạn
    function clean(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let bestClass = "";
        let highestProb = 0;

        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                bestClass = prediction[i].className;
            }
        }
        
        // Chuẩn hóa tên nhãn
        const label = clean(bestClass);

        // Xử lý logic hiển thị dựa trên 3 nhãn
        if (label.includes("nen")) {
            // Nếu là nhãn 'nền', hiển thị dấu chờ
            labelContainer.innerHTML = "<span style='color:#6c757d'>---</span>";
        } else if (highestProb > 0.7) { 
            // Chỉ hiển thị kết quả Đúng/Sai khi độ tự tin > 70%
            if (label.includes("dung")) {
                labelContainer.innerHTML = "<span style='color:#28a745'>ĐÚNG KỸ THUẬT ✔</span>";
            } else if (label.includes("sai")) {
                labelContainer.innerHTML = "<span style='color:#dc3545'>SAI KỸ THUẬT ✘</span>";
            } else {
                labelContainer.innerHTML = "<span style='color:#6c757d'>---</span>";
            }
        } else {
            // Khi AI đang phân vân, hiển thị trạng thái quét
            labelContainer.innerHTML = "<span style='color:#ccc; font-size: 20px;'>ĐANG QUÉT...</span>";
        }
    }

    async function switchCamera() {
        isFacingBack = !isFacingBack;
        if (webcam) { webcam.stop(); await initWebcam(); }
    }
</script>
</body>
</html>
