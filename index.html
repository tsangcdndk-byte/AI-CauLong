<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Cầm Cầu Lông - GV Thể Dục</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            text-align: center; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 10px;
            overflow-x: hidden; /* Chống tràn ngang */
        }
        .app-card { 
            width: 100%; 
            max-width: 420px; 
            margin: 5px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        
        h2 { color: #1a73e8; margin: 10px 0 5px 0; text-transform: uppercase; font-size: 1.2rem; }
        .sub-title { color: #666; font-size: 0.8rem; margin-bottom: 20px; }
        
        /* Khung Camera chuẩn vuông, tự co giãn theo màn hình */
        #webcam-wrapper { 
            position: relative; 
            margin: 0 auto 20px; 
            width: 100%; 
            max-width: 320px; 
            aspect-ratio: 1/1;
            border: 8px solid #333; 
            border-radius: 20px; 
            overflow: hidden; 
            background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #webcam-wrapper canvas { width: 100% !important; height: 100% !important; object-fit: cover; }

        .btn { 
            padding: 18px; font-size: 1.1rem; border-radius: 12px; border: none; 
            color: white; cursor: pointer; font-weight: bold; width: 100%; 
            margin-bottom: 12px; text-transform: uppercase; transition: opacity 0.2s;
        }
        #start-btn { background: #6dbb83; box-shadow: 0 4px 12px rgba(109,187,131,0.4); }
        #switch-btn { background: #007bff; display: none; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Dashboard % chuẩn như hình mẫu */
        #dashboard { display: none; margin-top: 20px; text-align: left; }
        .result-item { margin-bottom: 15px; padding: 12px; border-radius: 15px; background: #f8f9fa; border: 1px solid transparent; }
        .label-text { font-weight: bold; font-size: 0.95rem; color: #333; display: flex; justify-content: space-between; }
        .progress-bar { width: 100%; height: 12px; background: #e9ecef; border-radius: 6px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.2s ease-out; }

        .fill-dung { background: #28a745; }
        .fill-sai { background: #dc3545; }
        .fill-nen { background: #6c757d; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    <p class="sub-title">Phân tích kỹ thuật thời gian thực</p>

    <button id="start-btn" class="btn" onclick="startApp()">▶ BẮT ĐẦU KIỂM TRA</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA SAU/TRƯỚC</button>

    <div id="webcam-wrapper">
        <div id="placeholder" style="color: #888; font-size: 0.9rem;">Đang chờ kích hoạt...</div>
    </div>

    <div id="dashboard"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = false;
    let isBusy = false;

    async function startApp() {
        if (isBusy) return;
        isBusy = true;
        const startBtn = document.getElementById("start-btn");
        startBtn.innerText = "ĐANG TẢI MÔ HÌNH...";
        startBtn.disabled = true;

        try {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            await setupWebcam();
            createDashboard();
            startBtn.style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            window.requestAnimationFrame(loop);
        } catch (e) {
            console.error(e);
            alert("LỖI: Trình duyệt chặn Camera. Hãy mở bằng Safari/Chrome và nhấn 'Cho phép'.");
            startBtn.innerText = "▶ THỬ LẠI";
            startBtn.disabled = false;
        }
        isBusy = false;
    }

    async function setupWebcam() {
        if (webcam) { await webcam.stop(); }
        // Khởi tạo webcam với độ phân giải thấp hơn một chút để mượt trên máy yếu
        webcam = new tmImage.Webcam(300, 300, !isFacingBack);
        await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
        await webcam.play();
        const container = document.getElementById("webcam-wrapper");
        container.innerHTML = "";
        container.appendChild(webcam.canvas);
    }

    async function switchCamera() {
        if (isBusy) return;
        isBusy = true;
        isFacingBack = !isFacingBack;
        const btn = document.getElementById("switch-btn");
        const oldText = btn.innerText;
        btn.innerText = "ĐANG CHUYỂN...";
        
        try {
            await setupWebcam();
        } catch (e) {
            alert("Thiết bị không hỗ trợ đổi camera này.");
            isFacingBack = !isFacingBack;
            await setupWebcam();
        }
        btn.innerText = oldText;
        isBusy = false;
    }

    function createDashboard() {
        const dashboard = document.getElementById("dashboard");
        dashboard.innerHTML = "";
        const labels = model.getClassLabels();
        for (let i = 0; i < maxPredictions; i++) {
            const clean = labels[i].toLowerCase();
            let color = "fill-nen";
            if (clean.includes("dung")) color = "fill-dung";
            if (clean.includes("sai")) color = "fill-sai";
            dashboard.innerHTML += `
                <div class="result-item" id="item-${i}">
                    <span class="label-text"><span>${labels[i]}</span> <span id="perc-${i}">0%</span></span>
                    <div class="progress-bar"><div id="bar-${i}" class="progress-fill ${color}"></div></div>
                </div>`;
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const prob = (prediction[i].probability * 100).toFixed(0);
            document.getElementById(`perc-${i}`).innerText = prob + "%";
            document.getElementById(`bar-${i}`).style.width = prob + "%";
            const item = document.getElementById(`item-${i}`);
            if (prob > 70) {
                item.style.backgroundColor = "#e8f0fe";
                item.style.borderColor = "#1a73e8";
            } else {
                item.style.backgroundColor = "#f8f9fa";
                item.style.borderColor = "transparent";
            }
        }
    }
</script>
</body>
</html>
