<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Cầu Lông - GV Thể Dục</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .app-card { max-width: 400px; margin: 10px auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Đảm bảo các nút luôn hiển thị rõ ràng */
        .button-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        
        .btn { 
            display: block;
            width: 100%;
            padding: 20px; 
            font-size: 18px; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            box-sizing: border-box;
        }

        #start-btn { background: #28a745; display: block !important; } /* Ép buộc hiển thị */
        #switch-btn { background: #007bff; display: none; } /* Chỉ hiện sau khi nhấn Bắt đầu */
        
        #webcam-container { 
            margin: 15px auto; 
            border: 5px solid #333; 
            width: 280px; 
            height: 280px; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000;
        }
        #webcam-container canvas { width: 100% !important; height: 100% !important; object-fit: cover; }

        #result-box { 
            font-size: 30px; 
            font-weight: 900; 
            margin-top: 15px; 
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="app-card">
    <h2 style="color: #1a73e8; margin-top: 0;">AI CẦM CẦU LÔNG</h2>
    
    <div class="button-group">
        <button id="start-btn" class="btn" onclick="startCamera()">▶ BẮT ĐẦU KIỂM TRA</button>
        <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA</button>
    </div>

    <div id="webcam-container">
        <div id="placeholder" style="color: white; padding-top: 130px; font-size: 14px;">Camera đang chờ...</div>
    </div>

    <div id="result-box">---</div>
    <p id="status-info" style="font-size: 12px; color: #888;">Nhấn Bắt đầu để AI hoạt động</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, labelContainer, maxPredictions;
    let isFacingBack = false;

    async function startCamera() {
        const sBtn = document.getElementById("start-btn");
        sBtn.innerText = "ĐANG TẢI AI...";
        
        try {
            // Nạp mô hình
            if (!model) {
                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            }
            maxPredictions = model.getTotalClasses();
            
            // Khởi động webcam
            await initWebcam();
            
            // Sau khi thành công: Ẩn nút Bắt đầu, Hiện nút Đổi Camera
            sBtn.style.setProperty('display', 'none', 'important');
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("status-info").innerText = "Hệ thống ĐANG HOẠT ĐỘNG";
        } catch (err) {
            alert("Lỗi: Không mở được camera. Vui lòng kiểm tra quyền truy cập.");
            sBtn.innerText = "THỬ LẠI";
        }
    }

    async function initWebcam() {
        const flip = !isFacingBack;
        webcam = new tmImage.Webcam(280, 280, flip);
        const facingMode = isFacingBack ? "environment" : "user";
        await webcam.setup({ facingMode }); 
        await webcam.play();
        window.requestAnimationFrame(loop);
        
        const container = document.getElementById("webcam-container");
        container.innerHTML = ""; 
        container.appendChild(webcam.canvas);
        labelContainer = document.getElementById("result-box");
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    // Hàm khử dấu tiếng Việt tối ưu cho 2 nhãn của bạn
    function clean(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let bestClass = "";
        let highestProb = 0;

        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                bestClass = prediction[i].className;
            }
        }
        
        const label = clean(bestClass);

        if (highestProb > 0.7) { 
            if (label.includes("dung")) {
                labelContainer.innerHTML = "<span style='color:#28a745'>ĐÚNG KỸ THUẬT ✔</span>";
            } else if (label.includes("sai")) {
                labelContainer.innerHTML = "<span style='color:#dc3545'>SAI KỸ THUẬT ✘</span>";
            } else {
                labelContainer.innerHTML = "<span style='color:#6c757d'>---</span>";
            }
        } else {
            labelContainer.innerHTML = "<span style='color:#ccc; font-size: 20px;'>ĐANG QUÉT...</span>";
        }
    }

    async function switchCamera() {
        isFacingBack = !isFacingBack;
        if (webcam) { webcam.stop(); await initWebcam(); }
    }
</script>
</body>
</html>
