<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Kiểm Tra Cầm Cầu</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; overflow-x: hidden; }
        .app-card { width: 100%; max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; font-size: 1.1rem; margin: 10px 0; text-transform: uppercase; }
        
        #webcam-wrapper { 
            width: 100%; aspect-ratio: 1/1; border: 6px solid #333; border-radius: 20px; 
            background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        #webcam-wrapper canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
        #loading-overlay { position: absolute; color: white; font-size: 14px; display: none; background: rgba(0,0,0,0.6); width: 100%; height: 100%; padding-top: 130px; }

        .btn { padding: 18px; font-size: 16px; border-radius: 12px; border: none; color: white; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; text-transform: uppercase; }
        #start-btn { background: #28a745; }
        #switch-btn { background: #007bff; display: none; }

        .result-item { margin-top: 10px; padding: 10px; border-radius: 12px; background: #f8f9fa; text-align: left; transition: 0.2s; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    <p style="font-size: 12px; color: #666;">Hệ thống mặc định mở <b>Camera Sau</b></p>
    
    <button id="start-btn" class="btn" onclick="startApp()">▶ BẮT ĐẦU KIỂM TRA</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA TRƯỚC/SAU</button>
    
    <div id="webcam-wrapper">
        <div id="loading-overlay">ĐANG CẤU HÌNH CAMERA...</div>
        <div id="msg" style="color: #888; font-size: 13px;">Chờ nhấn Bắt đầu...</div>
    </div>
    
    <div id="dashboard" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = true; // ĐẶT MẶC ĐỊNH LÀ CAMERA SAU
    let isProcessing = false;

    async function startApp() {
        if(isProcessing) return;
        const startBtn = document.getElementById("start-btn");
        startBtn.innerText = "ĐANG TẢI MÔ HÌNH...";
        startBtn.disabled = true;

        try {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            await setupWebcam();
            createDashboard();
            startBtn.style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            window.requestAnimationFrame(loop);
        } catch (e) {
            alert("LỖI: Không thể mở Camera. Hãy đảm bảo bạn dùng Safari/Chrome và đã 'Cho phép' camera.");
            startBtn.innerText = "▶ THỬ LẠI";
            startBtn.disabled = false;
        }
    }

    async function setupWebcam() {
        document.getElementById("loading-overlay").style.display = "block";
        
        // 1. Dừng webcam cũ (nếu có)
        if (webcam) {
            await webcam.stop();
        }

        // 2. Chờ 500ms để phần cứng điện thoại "xả băng"
        await new Promise(resolve => setTimeout(resolve, 500));

        // 3. Khởi tạo webcam mới
        // Camera trước (!isFacingBack = false) thì flip=true
        // Camera sau (isFacingBack = true) thì flip=false
        const flip = !isFacingBack; 
        webcam = new tmImage.Webcam(300, 300, flip);
        
        await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
        await webcam.play();

        document.getElementById("webcam-wrapper").innerHTML = "";
        document.getElementById("webcam-wrapper").appendChild(webcam.canvas);
        document.getElementById("loading-overlay").style.display = "none";
    }

    async function switchCamera() {
        if (isProcessing) return;
        isProcessing = true;
        
        isFacingBack = !isFacingBack;
        const btn = document.getElementById("switch-btn");
        btn.innerText = "ĐANG CHUYỂN...";
        btn.disabled = true;

        try {
            await setupWebcam();
            btn.innerText = "🔄 ĐỔI CAMERA TRƯỚC/SAU";
        } catch (e) {
            alert("Thiết bị không hỗ trợ hoặc lỗi quyền camera.");
            isFacingBack = !isFacingBack;
        }
        
        btn.disabled = false;
        isProcessing = false;
    }

    function createDashboard() {
        const db = document.getElementById("dashboard");
        db.innerHTML = "";
        model.getClassLabels().forEach((l, i) => {
            const clean = l.toLowerCase();
            let color = clean.includes("dung") ? "#28a745" : (clean.includes("sai") ? "#dc3545" : "#6c757d");
            db.innerHTML += `
                <div class="result-item" id="row-${i}">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:14px;">
                        <span>${l}</span> <span id="p${i}">0%</span>
                    </div>
                    <div class="bar-bg"><div id="b${i}" class="bar-fill" style="background:${color}"></div></div>
                </div>`;
        });
    }

    async function loop() {
        webcam.update();
        const pred = await model.predict(webcam.canvas);
        pred.forEach((p, i) => {
            const prob = (p.probability * 100).toFixed(0);
            document.getElementById(`p${i}`).innerText = prob + "%";
            document.getElementById(`b${i}`).style.width = prob + "%";
            document.getElementById(`row-${i}`).style.background = prob > 70 ? "#e8f0fe" : "#f8f9fa";
        });
        window.requestAnimationFrame(loop);
    }
</script>
</body>
</html>
