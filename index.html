<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Cầm Cầu Lông</title>
    <style>
        /* Thiết lập chung chống tràn */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            text-align: center; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 10px;
            overflow-x: hidden;
        }
        .app-card { 
            width: 100%; 
            max-width: 400px; 
            margin: 5px auto; 
            background: white; 
            padding: 15px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
        }
        
        h2 { color: #1a73e8; margin: 10px 0 5px 0; text-transform: uppercase; font-size: 18px; }
        .sub-title { color: #666; font-size: 12px; margin-bottom: 15px; }
        
        /* Khung Camera linh hoạt theo màn hình */
        #webcam-wrapper { 
            position: relative; 
            margin: 0 auto 15px; 
            width: 100%; 
            max-width: 300px; 
            aspect-ratio: 1/1; /* Luôn giữ khung vuông */
            border: 6px solid #333; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        #webcam-wrapper canvas { width: 100% !important; height: 100% !important; object-fit: cover; }

        /* Nút bấm chuẩn mobile */
        .btn { 
            padding: 16px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        #start-btn { background: #6dbb83; }
        #switch-btn { background: #007bff; display: none; }
        
        /* Kết quả Dashboard */
        #dashboard { display: none; margin-top: 15px; text-align: left; }
        .result-item { 
            margin-bottom: 10px; 
            padding: 10px; 
            border-radius: 10px; 
            background: #f1f3f4; 
            border: 1px solid transparent; 
        }
        .label-text { font-weight: bold; font-size: 14px; color: #333; display: flex; justify-content: space-between; }
        .progress-bar { width: 100%; height: 10px; background: #dfe1e5; border-radius: 5px; overflow: hidden; margin-top: 6px; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.2s ease-out; }

        .fill-dung { background: #28a745; }
        .fill-sai { background: #dc3545; }
        .fill-nen { background: #6c757d; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    <p class="sub-title">Phân tích kỹ thuật thời gian thực</p>

    <button id="start-btn" class="btn" onclick="startApp()">▶ BẮT ĐẦU KIỂM TRA</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA SAU/TRƯỚC</button>

    <div id="webcam-wrapper">
        <div id="placeholder" style="color: #666; font-size: 13px;">Đang chờ tín hiệu...</div>
    </div>

    <div id="dashboard"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = false;
    let isTransitioning = false;

    async function startApp() {
        const startBtn = document.getElementById("start-btn");
        startBtn.innerText = "ĐANG TẢI MÔ HÌNH...";
        startBtn.disabled = true;

        try {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            await setupWebcam();
            createDashboard();
            startBtn.style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            window.requestAnimationFrame(loop);
        } catch (e) {
            alert("Lỗi: Hãy đảm bảo bạn đã cấp quyền Camera trên trình duyệt.");
            startBtn.innerText = "▶ THỬ LẠI";
            startBtn.disabled = false;
        }
    }

    async function setupWebcam() {
        if (webcam) { await webcam.stop(); }
        
        // Kích thước chuẩn vuông để khớp với CSS
        webcam = new tmImage.Webcam(300, 300, !isFacingBack); 
        await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
        await webcam.play();

        const container = document.getElementById("webcam-wrapper");
        container.innerHTML = "";
        container.appendChild(webcam.canvas);
    }

    async function switchCamera() {
        if (isTransitioning) return;
        isTransitioning = true;
        
        isFacingBack = !isFacingBack;
        const switchBtn = document.getElementById("switch-btn");
        switchBtn.innerText = "ĐANG CHUYỂN...";
        
        try {
            await setupWebcam();
            switchBtn.innerText = "🔄 ĐỔI CAMERA SAU/TRƯỚC";
        } catch (e) {
            alert("Thiết bị không hỗ trợ đổi camera này.");
            isFacingBack = !isFacingBack;
        }
        isTransitioning = false;
    }

    function createDashboard() {
        const dashboard = document.getElementById("dashboard");
        dashboard.innerHTML = "";
        const labels = model.getClassLabels();
        for (let i = 0; i < maxPredictions; i++) {
            const clean = labels[i].toLowerCase();
            let color = "fill-nen";
            if (clean.includes("dung")) color = "fill-dung";
            if (clean.includes("sai")) color = "fill-sai";
            dashboard.innerHTML += `
                <div class="result-item" id="item-${i}">
                    <span class="label-text"><span>${labels[i]}</span> <span id="perc-${i}">0%</span></span>
                    <div class="progress-bar"><div id="bar-${i}" class="progress-fill ${color}"></div></div>
                </div>`;
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const prob = (prediction[i].probability * 100).toFixed(0);
            document.getElementById(`perc-${i}`).innerText = prob + "%";
            document.getElementById(`bar-${i}`).style.width = prob + "%";
            const item = document.getElementById(`item-${i}`);
            item.style.backgroundColor = prob > 70 ? "#e8f0fe" : "#f1f3f4";
            item.style.borderColor = prob > 70 ? "#1a73e8" : "transparent";
        }
    }
</script>
</body>
</html>
