<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Kiểm Tra Kỹ Thuật Cầm Cầu</title>
    <style>
        /* CSS xây dựng bố cục giống hệt hình ảnh */
        body { font-family: -apple-system, system-ui, sans-serif; text-align: center; background-color: #f8f9fa; margin: 0; padding: 15px; }
        .app-card { width: 100%; max-width: 420px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        
        /* Header */
        h2 { color: #1a73e8; margin-bottom: 5px; text-transform: uppercase; font-size: 20px; }
        p.sub-title { color: #666; font-size: 13px; margin-bottom: 20px; }
        
        /* Khung Camera */
        #webcam-wrapper { 
            position: relative; margin: 0 auto 20px; width: 280px; height: 280px; 
            border: 6px solid #333; border-radius: 15px; overflow: hidden; background: #000;
        }
        #webcam-wrapper canvas { width: 100% !important; height: 100% !important; object-fit: cover; }

        /* Nút Bấm - Giao diện nút to trên di động */
        .btn { 
            padding: 18px 25px; font-size: 17px; border-radius: 12px; border: none; 
            color: white; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 12px;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        #start-btn { background: #28a745; display: block !important; } /* Ép buộc hiển thị nút Bắt đầu */
        #switch-btn { background: #007bff; display: none; } /* Chỉ hiện sau khi Bắt đầu */
        
        /* Bảng hiển thị kết quả chi tiết (%) */
        #dashboard { display: none; margin-top: 20px; text-align: left; }
        .result-item { margin-bottom: 12px; padding: 10px; border-radius: 10px; background: #f1f3f4; }
        .label-text { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; }
        .progress-bar { width: 100%; height: 12px; background: #dfe1e5; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.1s; }

        /* Màu sắc cho từng nhãn (%) */
        .fill-dung { background: #28a745; }
        .fill-sai { background: #dc3545; }
        .fill-nen { background: #6c757d; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>AI CẦM CẦU LÔNG</h2>
    <p class="sub-title">Phân tích kỹ thuật thời gian thực</p>

    <button id="start-btn" class="btn" onclick="startApp()">▶ BẮT ĐẦU KIỂM TRA</button>
    <button id="switch-btn" class="btn" onclick="switchCamera()">🔄 ĐỔI CAMERA SAU/TRƯỚC</button>

    <div id="webcam-wrapper">
        <div id="placeholder" style="color: white; padding-top: 130px; font-size: 14px;">Camera sẽ hiển thị tại đây</div>
    </div>

    <div id="dashboard">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/-hHHKzHuH/";
    let model, webcam, maxPredictions;
    let isFacingBack = false;

    // Giai đoạn 1: Bắt đầu - Cấp quyền camera & Khởi động
    async function startApp() {
        const startBtn = document.getElementById("start-btn");
        startBtn.innerText = "ĐANG TẢI MÔ HÌNH...";
        startBtn.disabled = true;
        startBtn.style.opacity = "0.7";

        try {
            // Nạp mô hình AI
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            // Khởi động Camera
            await setupWebcam();
            
            // Tạo sẵn các thanh bar kết quả dựa theo labels
            createDashboard();

            // Hiển thị nút Đổi camera & Dashboard, ẩn nút Bắt đầu
            startBtn.style.display = "none";
            document.getElementById("switch-btn").style.display = "block";
            document.getElementById("dashboard").style.display = "block";
            
            window.requestAnimationFrame(loop);
        } catch (e) {
            alert("Lỗi: Không thể mở camera. Hãy nhấn biểu tượng ổ khóa trên thanh địa chỉ để cho phép.");
            startBtn.innerText = "▶ THỬ LẠI BẮT ĐẦU";
            startBtn.disabled = false;
            startBtn.style.opacity = "1";
        }
    }

    async function setupWebcam() {
        const flip = !isFacingBack;
        webcam = new tmImage.Webcam(280, 280, flip);
        await webcam.setup({ facingMode: isFacingBack ? "environment" : "user" });
        await webcam.play();
        const container = document.getElementById("webcam-wrapper");
        container.innerHTML = ""; // Xóa placeholder
        container.appendChild(webcam.canvas);
    }

    function createDashboard() {
        const dashboard = document.getElementById("dashboard");
        dashboard.innerHTML = "";
        const labels = model.getClassLabels();
        
        for (let i = 0; i < maxPredictions; i++) {
            // Chuẩn hóa tên nhãn không phân biệt hoa/thường để gắn màu
            const labelClean = labels[i].toLowerCase();
            let colorClass = "fill-nen"; // Mặc định màu xám
            
            if (labelClean.includes("dung")) colorClass = "fill-dung"; // Màu xanh lá
            if (labelClean.includes("sai")) colorClass = "fill-sai";   // Màu đỏ

            dashboard.innerHTML += `
                <div class="result-item" id="item-${i}">
                    <span class="label-text" id="label-${i}">${labels[i]}: <span id="perc-${i}">0%</span></span>
                    <div class="progress-bar"><div id="bar-${i}" class="progress-fill ${colorClass}"></div></div>
                </div>`;
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const prob = (prediction[i].probability * 100).toFixed(0);
            
            // Cập nhật thanh bar và con số % thời gian thực
            document.getElementById(`perc-${i}`).innerText = prob + "%";
            document.getElementById(`bar-${i}`).style.width = prob + "%";
            
            // Làm nổi bật dòng có kết quả cao nhất (>70%)
            if (prob > 70) {
                document.getElementById(`item-${i}`).style.backgroundColor = "#e8f0fe";
            } else {
                document.getElementById(`item-${i}`).style.backgroundColor = "#f1f3f4";
            }
        }
    }

    async function switchCamera() {
        isFacingBack = !isFacingBack;
        if (webcam) {
            webcam.stop();
            await setupWebcam();
        }
    }
</script>
</body>
</html>
